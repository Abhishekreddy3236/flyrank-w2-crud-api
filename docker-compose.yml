version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tasks}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-dev}
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: taskdb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-tasks}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-dev}
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata:
    name: taskdata
